name: Python checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test and model dependencies
        run: python -m pip install pytest bcrypt joblib numpy pandas python-dotenv scikit-learn SQLAlchemy xgboost
      - name: Run test suite
        run: python -m pytest -q
      - name: Verify model training
        run: python -m ml.train --no-db
